name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew (Unix)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: chmod +x ./gradlew

      - name: Show Java and Gradle info
        if: runner.os != 'Windows'
        run: |
          java -version
          ./gradlew -version
        shell: bash

      - name: Show Java and Gradle info (Windows)
        if: runner.os == 'Windows'
        run: |
          java -version
          .\gradlew.bat -version
        shell: powershell

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew clean build --no-daemon --warning-mode=all
        shell: bash

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean build --no-daemon --warning-mode=all
        shell: powershell
