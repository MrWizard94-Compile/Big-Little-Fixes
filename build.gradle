plugins {
    id 'java'
    id 'checkstyle'
    id 'com.github.spotbugs' version '5.1.3'
    id 'jacoco'
}

// Project coordinates come from gradle.properties
group = project.findProperty('mavenGroup') ?: 'com.mrwizard94'
version = project.findProperty('modVersion') ?: '1.0.0'
archivesBaseName = project.findProperty('archivesBaseName') ?: 'biglittlefixes'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.findProperty('javaVersion') ?: '17'))
    }
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}

// Compiler strictness: treat warnings as errors to enforce zero-warnings policy
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

// Checkstyle configuration
checkstyle {
    toolVersion = '10.12.4'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    ignoreFailures = false
    showViolations = true
}

// SpotBugs configuration
spotbugs {
    toolVersion = '4.7.3'
    effort = 'max'
    reportLevel = 'high'
}


// JaCoCo configuration
jacoco {
    toolVersion = '0.8.10'
}

tasks.test {
    useJUnitPlatform()
    finalizedBy(tasks.jacocoTestReport)
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

tasks.jacocoTestReport {
    dependsOn(tasks.test)
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

// Coverage verification - allow 0.0 minimum for now so build doesn't fail
jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION'
                value = 'COVERED_RATIO'
                minimum = 0.0
            }
        }
    }
}

// Ensure 'check' lifecycle runs static analysis and coverage verification
tasks.check {
    dependsOn tasks.named('spotbugsMain')
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Jar manifest metadata
tasks.jar {
    manifest {
        attributes(
            'Implementation-Title': (project.findProperty('modName') ?: 'Big Little Fixes'),
            'Implementation-Version': project.version,
            'Implementation-Vendor': (project.findProperty('modGroup') ?: 'MrWizard94')
        )
    }
}
